name: PowerBridge
options:
  bundleIdPrefix: com.anas
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  PowerBridge:
    type: application
    platform: iOS
    sources: [PowerBridge]
    info:
      path: PowerBridge/Info.plist
      properties:
        CFBundleDisplayName: PowerBridge
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Connect securely to your computers and send Wake-on-LAN packets.
        NSFaceIDUsageDescription: Confirm power actions on your computer.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anas.PowerBridge
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
